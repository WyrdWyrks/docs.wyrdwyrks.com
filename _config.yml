title: Celestial Wayfinder Docs
description: Documentation for the Celestial Wayfinder, a DEF CON badge by WyrdWyrks.
url: https://docs.wyrdwyrks.com
baseurl: ""

remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap

# Rewrite relative .md links (the kind Obsidian writes) to their built URLs.
relative_links:
  enabled: true
  collections: true

# ---- Just the Docs options ----

search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

aux_links:
  WyrdWyrks:
    - "https://wyrdwyrks.com"
aux_links_new_tab: true

heading_anchors: true
color_scheme: dark

# In-page tables of contents (kramdown's native {:toc} marker) only go this
# deep, so they stay a section map instead of a full heading outline.
kramdown:
  toc_levels: 1..2

back_to_top: true
back_to_top_text: "Back to top"

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - README.md
